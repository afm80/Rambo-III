name: Build Luanti Minecraft Clone APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Auto Accept Android Licenses Direct
        run: |
          mkdir -p -m 0730 "$ANDROID_HOME/licenses"
          echo -e "\n24436f477b46b29b1d54115b9e7de6e0b4d538a1" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n271017440bc41b75312cedc221a48b2d7b1b1fcb" > "$ANDROID_HOME/licenses/android-googletv-license"

      - name: Install Missing Translation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Fix Scripts Permissions
        run: |
          chmod +x ./util/ci/*.sh || true
          chmod +x ./android/gradlew || true

      - name: Build Android App
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-clone-apk
          path: android/app/build/outputs/apk/release/*.apk
