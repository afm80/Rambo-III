name: Build Luanti Minecraft Clone APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Force Accept All Android Licenses
        run: |
          # إنشاء مجلدات الرخص في جميع المسارات المتوقعة
          mkdir -p -m 0730 "$ANDROID_HOME/licenses"
          mkdir -p -m 0730 "/usr/local/lib/android/sdk/licenses"
          
          # إعداد بصمات الرخص الرسمية
          LICENSES=(
            "24436f477b46b29b1d54115b9e7de6e0b4d538a1"
            "84831b9409646a918e30573bab4c9c91346d8abd"
            "271017440bc41b75312cedc221a48b2d7b1b1fcb"
            "6072152b3b2bb113d6a36d61a0f980e15951c33f"
          )
          
          # حقن الرخص في المسار الأول
          for lic in "${LICENSES[@]}"; do
            echo -e "\n$lic" >> "$ANDROID_HOME/licenses/android-sdk-license"
            echo -e "\n$lic" >> "$ANDROID_HOME/licenses/android-googletv-license"
          done
          
          # حقن الرخص في المسار الثاني البديل
          for lic in "${LICENSES[@]}"; do
            echo -e "\n$lic" >> "/usr/local/lib/android/sdk/licenses/android-sdk-license"
            echo -e "\n$lic" >> "/usr/local/lib/android/sdk/licenses/android-googletv-license"
          done

      - name: Install Missing Translation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Fix Scripts Permissions
        run: |
          chmod +x ./util/ci/*.sh || true
          chmod +x ./android/gradlew || true

      - name: Build Android App
        run: |
          cd android
          # تمرير أمر تخطي الفحص والقبول التلقائي الإضافي أثناء البناء
          yes | ./gradlew assembleRelease --no-daemon || ./gradlew assembleRelease --no-daemon -Pandroid.skipDependencyValidation=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-clone-apk
          path: android/app/build/outputs/apk/release/*.apk
