name: Build Luanti Minecraft Clone APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Auto Accept Android Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | ${ANDROID_HOME}/tools/bin/sdkmanager --licenses || true

      - name: Fix Scripts Permissions
        run: |
          chmod +x ./util/ci/*.sh || true
          chmod +x ./android/gradlew || true

      - name: Build Android App
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-clone-apk
          path: android/app/build/outputs/apk/release/*.apk
